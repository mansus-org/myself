# Build the repo's Dockerfile and push it to GHCR once the CI workflow has
# passed on a commit of main. Production only ever runs a commit whose tests
# passed: a push to main whose CI fails is never built here.
# The cluster notices the new sha-<commit> tag within a few minutes and
# deploys it (Argo CD Image Updater). Nothing else to do per release.
# Pull requests get a preview: pr-<number>-<commit> is pushed and the cluster
# runs it at https://<repo>-pr-<number>.mansus.org until the PR closes.
# Docs: docs/app-platform/ in nemoNoboru/k3s-hetzner-gitops.
name: deploy

on:
  # Production waits for CI. workflow_run fires when CI finishes, for every
  # branch it ran on; the job below keeps only a successful push run on main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  # A person deploying main's tip by hand, on purpose: the one way past CI.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# main (a workflow_run event's ref is main's): one build at a time, a newer
# run waits instead of racing an older one. PRs (ref refs/pull/<n>/merge): a
# new push cancels the PR's running build.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    # A CI run that passed for a push to main, or a person's dispatch on main.
    # A dispatch from any other branch would push a sha-* tag, which Image
    # Updater ships to production, so it is refused.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    # Self-hosted ARC runners on the cluster (apps/arc-runner.yaml).
    runs-on: arc-runner
    env:
      # The commit CI passed on. github.sha on a workflow_run event is wherever
      # main points when the event fires, which can already be a later commit.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # CI runs finish in any order. Only the commit main points at now is
      # built, so a slow run for an older commit can never roll production
      # back; the newer commit's own CI run deploys it when it passes.
      - id: tip
        shell: bash
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$DEPLOY_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is at ${tip::7} now, not ${DEPLOY_SHA::7}: that commit's CI run deploys it"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      # Image names must be lowercase: ghcr.io/mansus-org/<repo>.
      - id: image
        if: steps.tip.outputs.current == 'true'
        shell: bash
        run: |
          {
            echo "name=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "version=sha-${DEPLOY_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - if: steps.tip.outputs.current == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.tip.outputs.current == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<7 char commit> (what the cluster deploys) and latest, both
      # from DEPLOY_SHA rather than the event's own sha.
      - id: meta
        if: steps.tip.outputs.current == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.image.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}

      - if: steps.tip.outputs.current == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max

  preview:
    # Branches of this repo only. A fork's code never gets built here, so its
    # PR has no image and no working preview.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: arc-runner
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      # The PR's own head commit, not the merge commit GitHub checks out by
      # default: the cluster looks for this exact sha in the tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Tag pr-<number>-<7 char head sha>. It must never look like sha-*, or
      # Image Updater would deploy it to production.
      - id: image
        shell: bash
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          {
            echo "name=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "tag=pr-${PR}-${HEAD_SHA::7}"
            echo "url=https://${repo,,}-pr-${PR}.mansus.org"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reads main's cache; writes its own to the Actions cache (per PR,
      # expires by itself) so PR builds don't overwrite main's buildcache.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
          cache-from: |
            type=registry,ref=${{ steps.image.outputs.name }}:buildcache
            type=gha,scope=pr-${{ github.event.pull_request.number }}
          cache-to: type=gha,scope=pr-${{ github.event.pull_request.number }},mode=max,ignore-error=true

      # One comment per PR, edited on every push.
      - uses: actions/github-script@v7
        env:
          URL: ${{ steps.image.outputs.url }}
          TAG: ${{ steps.image.outputs.tag }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- k3s-preview -->';
            const { URL, TAG, HEAD_SHA } = process.env;
            const body = [
              marker,
              `**Preview:** ${URL}`,
              '',
              `Image \`${TAG}\` (commit ${HEAD_SHA.slice(0, 7)}) is built. The cluster deploys it within about 2 minutes.`,
              'The first deploy of a PR can take a few minutes more while the HTTPS certificate is issued.',
              'The preview is deleted when this PR is closed or merged.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
