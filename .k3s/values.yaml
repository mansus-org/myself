# Deploy settings for myself.mansus.org on the mansus.org cluster.
# All options: charts/app/values.yaml in nemoNoboru/k3s-hetzner-gitops.
# Previews (myself-pr-<N>.mansus.org) use the same values: same admin token,
# their own empty volume.

ingress:
  host: myself.mansus.org

port: 8080

# The brain and tokens.json live here. One replica (the chart default).
persistence:
  enabled: true
  size: 1Gi
  mountPath: /data

# The image runs as 10001; fsGroup makes the local-path volume writable.
podSecurityContext:
  fsGroup: 10001

env:
  MYSELF_FILE: /data/brain.jsonl
  # sha256 (hex) of the admin token, not the token itself.
  MYSELF_ADMIN_TOKEN_SHA256: d35608020b3f8ebe48d0f8cd38a75320a84585f06c5c1dfb639588e95b3a68f8

# The brain lives in the cluster's Neo4j (PR #49). Both keys come from one sealed
# secret so the switch is atomic: with no secret neither variable is set and the
# server stays on /data/brain.jsonl, which is kept in place as the rollback. A wrong
# URL or password fails serve at startup on purpose instead of losing a write later.
  MYSELF_NEO4J_URL:
    secretKeyRef: { name: myself-secrets, key: MYSELF_NEO4J_URL }
  MYSELF_NEO4J_PASSWORD:
    secretKeyRef: { name: myself-secrets, key: MYSELF_NEO4J_PASSWORD }

healthCheck:
  path: /healthz

resources:
  requests: { cpu: 10m, memory: 16Mi }
  limits: { memory: 128Mi }

# Sealed with kubeseal against the cluster controller, namespace-scoped to myself.
sealedSecrets:
  - name: myself-secrets
    encryptedData:
      MYSELF_NEO4J_URL: 
      MYSELF_NEO4J_PASSWORD: 
